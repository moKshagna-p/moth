name: macOS checks
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
          - runner: macos-26-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: node --test ui/*.test.cjs
      - name: Native XCTest suite
        run: swift test --package-path native
      - run: sh scripts/build-app.sh
      - run: sh scripts/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Moth-macOS-${{ matrix.architecture }}
          path: |
            target/release/Moth.zip
            target/release/*.dmg
            target/release/*.sha256
          if-no-files-found: error
